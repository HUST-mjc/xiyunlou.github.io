<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四禧丸子 · 禧运楼 · 国风虚拟偶像</title>

    <!-- 引入 Fira Code 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- 引入自动生成的文件列表（由 Python 脚本生成） -->
    <script src="filelist.js"></script>

    <!-- 主样式表 -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- ========== Live2D 核心依赖（本地引用） ========== -->
    <!-- 1. PIXI 核心库 (必须是 v6) -->
    <script src="js/pixi.min.js"></script>
    <!-- 2. Cubism 核心运行时 -->
    <script src="js/live2dcubismcore.min.js"></script>
    <!-- 3. Live2D 显示插件 -->
    <script src="js/cubism4.min.js"></script>
</head>

<body>
    <!-- 天气效果覆盖层 -->
    <div id="weatherEffect" class="weather-overlay"></div>

    <!-- 进度条 -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 背景图层 -->
    <div class="background-layer"></div>

    <!-- 毛玻璃覆盖层 -->
    <div class="glass-overlay"></div>

    <!-- ========== 页面组件（由 loader.js 动态加载） ========== -->

    <!-- 导航栏 -->
    <div id="comp-nav"></div>

    <!-- 头部Hero（禧运楼背景区域） -->
    <div id="comp-hero"></div>

    <!-- 主内容区 -->
    <main>
        <div id="comp-about"></div>
        <div id="comp-skills"></div>
        <div id="comp-portfolio"></div>
        <div id="comp-music"></div>
        <div id="comp-milestones"></div>
        <div id="comp-games"></div>
        <div id="comp-merch"></div>
        <div id="comp-gallery"></div>
        <div id="comp-universe"></div>
        <div id="comp-anzi"></div>
        <div id="comp-social"></div>
        <div id="comp-footer"></div>
    </main>

    <!-- 视频弹窗 -->
    <div id="comp-modal"></div>

    <!-- ========== Live2D 模型容器 ========== -->
    <div id="live2d-container">
        <canvas id="live2d-stage"></canvas>
    </div>

    <!-- 脚本加载顺序 -->
    <script src="js/loader.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/live2d-loader.js"></script>
</body>

</html>
